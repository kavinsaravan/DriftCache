#version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: driftcache-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-driftcache}
      POSTGRES_USER: ${POSTGRES_USER:-driftcache}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driftcache_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-driftcache} -d ${POSTGRES_DB:-driftcache}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - driftcache-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: driftcache-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - driftcache-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: driftcache-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-driftcache}:${POSTGRES_PASSWORD:-driftcache_password}@postgres:5432/${POSTGRES_DB:-driftcache}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-driftcache}
      POSTGRES_USER: ${POSTGRES_USER:-driftcache}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driftcache_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      API_KEY: ${API_KEY:-}
      METRICS_API_KEY: ${METRICS_API_KEY:-}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.90}
      ENABLE_TRAINING: ${ENABLE_TRAINING:-true}
      HF_TOKEN: ${HF_TOKEN:-}
      INDEX_STORAGE_DIR: /app/data/cache
    ports:
      - "8000:8000"
    volumes:
      - faiss_indices:/app/data/cache
      - model_artifacts:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://localhost:8000/api/v1/status', timeout=2).status == 200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - driftcache-network

  # Frontend Web UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: driftcache-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - driftcache-network

networks:
  driftcache-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  faiss_indices:
    driver: local
  model_artifacts:
    driver: local
